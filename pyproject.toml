[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forex-algo-bot"
version = "0.1.0"
description = "Modular event-driven Forex research, backtesting, risk, and execution platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Project Maintainers" }]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["fxbot"]

[tool.coverage.run]
branch = true
source = ["fxbot"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[[tool.mypy.overrides]]
module = ["MetaTrader5", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
